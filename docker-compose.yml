services:
  backend:
    build: ./backend
    ports:
      - "8001:8000"
    secrets:
      - postgres_dsn
      # PAWN 2.0 Phase E.4: optional. Absent -> SHARED_DB_DSN falls back to
      # POSTGRES_DSN (today's exact behavior). To share keys live with prod
      # from local dev: bring up the `keys-tunnel` service below (profile
      # `tunnel`, same pattern as `pgrst-tunnel`), then put a DSN pointing at
      # 127.0.0.1:<tunnel-port> in ./secrets/shared_db_dsn.
      - shared_db_dsn
      - encryption_secret
      - google_client_id
      - google_client_secret
      - jwt_secret
      # Phase 1b pool keys — verified live (2026-07-23) that `docker compose
      # up` tolerates missing source files here (just a "secret file does
      # not exist" warning, exit 0); `required: false` isn't a field this
      # Compose version supports, and isn't needed. read_pool_key() falls
      # through to BYOK for any provider whose file is absent.
      - pool_cerebras_api_key
      - pool_github_api_key
      - pool_google_api_key
      - pool_groq_api_key
      - pool_huggingface_api_key
      - pool_kluster_api_key
      - pool_mistral_api_key
      - pool_nvidia_api_key
      - pool_openrouter_api_key
      - pool_sambanova_api_key
      - pool_zhipu_api_key
    environment:
      # PAWN 2.0 Phase E.1: explicit even though "dev" is already config.py's
      # default — this local compose is the primary place isolation matters
      # (same Google account as prod), so make it self-evident, not implicit.
      - PAWN_ENV=dev
      # Public URL for the self-hosted PostgREST instance (D.4) — non-secret,
      # injected into warm Kaggle-session payloads. Blank by default: the
      # D.3/D.4 migration off Supabase (whose REST URL was always public,
      # so local warm-session testing worked before that migration with no
      # extra setup) moved PostgREST to a local-only Docker container with no
      # public URL. To test warm sessions locally, use the `pgrst-tunnel`
      # service below (see its comment) instead of editing this line —
      # a docker-compose.override.yml supplies the real value.
      - POSTGREST_PUBLIC_URL=
    volumes:
      - ./backend/data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /app/app
        - action: rebuild
          path: ./backend/requirements.txt

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: pawn
      POSTGRES_USER: pawn
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - postgrest_anon_password
    volumes:
      - pawn_postgres_data:/var/lib/postgresql/data
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./postgres/init_pawn_anon.sh:/docker-entrypoint-initdb.d/02_pawn_anon.sh:ro
    ports:
      # 5433, not 5432 — 5432 collides with other local Postgres containers
      # (e.g. a sibling project's timescaledb) on a dev machine. Loopback-only;
      # only for host-side psql/GUI debugging, the backend reaches this over
      # the internal Docker network at postgres:5432 regardless.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawn -d pawn"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:v12.2.3
    environment:
      PGRST_DB_URI: "@/run/secrets/postgrest_db_uri"
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: pawn_anon
    secrets:
      - postgrest_db_uri
    depends_on:
      postgres:
        condition: service_healthy
    # No host port: internal-only, reached over HTTPS via the Nginx reverse
    # proxy set up in D.7 (production). Not usable from a local dev compose up
    # alone — see the POSTGREST_PUBLIC_URL note on the backend service above.

  # Dev-only reverse SSH tunnel so a remote Kaggle warm-session kernel can
  # reach the local `postgrest` container over a STABLE public HTTPS URL
  # (regression from the D.3/D.4 Supabase -> self-hosted Postgres+PostgREST
  # migration: Supabase's URL was always public, so local warm-session
  # testing worked before that migration without this). Replaces the old
  # `cloudflared` quick-tunnel, which minted a brand-new random
  # *.trycloudflare.com hostname on every restart -- breaking any
  # already-running Kaggle kernel's baked-in payload and requiring a manual
  # docker-compose.override.yml edit every single time. This tunnel reaches
  # a stable Nginx location (/pgrst-dev/) on the same Oracle VM that already
  # hosts production, via a dedicated SSH key restricted (in the VM's
  # authorized_keys) to forwarding only 127.0.0.1:3002 -- no shell, no other
  # host/port. One-time VM setup required -- see deployment.md "Local-dev
  # PostgREST tunnel". Not part of the default `docker compose up` -- gated
  # behind the `tunnel` profile so nothing changes for anyone not testing
  # Image Lab locally. Usage:
  #   docker compose --profile tunnel up -d pgrst-tunnel   # stays up permanently
  #   copy docker-compose.override.yml.example to docker-compose.override.yml
  #   (POSTGREST_PUBLIC_URL is fixed -- never needs updating again)
  #   docker compose up -d backend
  # `restart: unless-stopped` + ssh's own keepalive/ExitOnForwardFailure
  # handle reconnects automatically across restarts/sleep/network blips --
  # no autossh needed, Docker itself is the process supervisor here.
  pgrst-tunnel:
    image: alpine:3.20
    # Copies the secret-mounted key to a scratch path and chmods it 600 first --
    # on Windows/Docker Desktop, secret file mounts come through as 0777 (no
    # POSIX permission translation from the host filesystem), which ssh
    # refuses to use directly ("UNPROTECTED PRIVATE KEY FILE").
    entrypoint: sh -c "apk add --no-cache openssh-client >/dev/null && cp /run/secrets/pgrst_tunnel_key /tmp/tunnel_key && chmod 600 /tmp/tunnel_key && exec ssh -i /tmp/tunnel_key -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ExitOnForwardFailure=yes -N -R 127.0.0.1:3002:postgrest:3000 ubuntu@144.24.119.184"
    secrets:
      - pgrst_tunnel_key
    depends_on:
      - postgrest
    restart: unless-stopped
    profiles:
      - tunnel

  # PAWN 2.0 Phase E.4: dev-only FORWARD SSH tunnel so this local backend can
  # reach PROD's Postgres for the one deliberately-shared table set
  # (user_api_keys, pool_api_keys) via SHARED_DB_DSN. Opposite direction from
  # pgrst-tunnel above (that's a REMOTE tunnel letting a Kaggle kernel reach
  # local Postgrest; this is a local port forwarded to the VM's Postgres).
  # Requires: (1) the one-time VM-side authorized_keys restriction described
  # on keys_tunnel_key above, (2) prod's real Postgres port open to
  # 127.0.0.1 on the VM (already true -- it's never exposed publicly), (3)
  # `secrets/shared_db_dsn` pointing at host `keys-tunnel`, port 5434 (Docker
  # Compose's internal DNS resolves the service name across containers on
  # this network -- no host port mapping needed, and none is published, so
  # this never touches the host's network at all) with prod's real DB
  # credentials, and (4) dev carrying prod's ENCRYPTION_SECRET to decrypt the
  # shared key blobs -- the one real security cost of this, accepted for a
  # solo operator per the plan's own risk #6. Gated behind the `tunnel`
  # profile like pgrst-tunnel -- inert for anyone not deliberately opting
  # into live dev/prod key sharing.
  # Usage: docker compose --profile tunnel up -d keys-tunnel
  keys-tunnel:
    image: alpine:3.20
    entrypoint: sh -c "apk add --no-cache openssh-client >/dev/null && cp /run/secrets/keys_tunnel_key /tmp/tunnel_key && chmod 600 /tmp/tunnel_key && exec ssh -i /tmp/tunnel_key -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ExitOnForwardFailure=yes -N -L 0.0.0.0:5434:127.0.0.1:5432 ubuntu@144.24.119.184"
    secrets:
      - keys_tunnel_key
    restart: unless-stopped
    profiles:
      - tunnel

  frontend:
    build: ./frontend
    ports:
      - "5174:5173"
    environment:
      - VITE_API_URL=http://localhost:8001
    volumes:
      - /app/node_modules
    command: npm run dev -- --host
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: rebuild
          path: ./frontend/package.json

volumes:
  pawn_postgres_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  postgres_dsn:
    file: ./secrets/postgres_dsn
  # PAWN 2.0 Phase E.4: optional, keys-only shared DB. See secrets/shared_db_dsn.example.
  shared_db_dsn:
    file: ./secrets/shared_db_dsn
  postgrest_anon_password:
    file: ./secrets/postgrest_anon_password
  postgrest_db_uri:
    file: ./secrets/postgrest_db_uri
  encryption_secret:
    file: ./secrets/encryption_secret
  google_client_id:
    file: ./secrets/google_client_id
  google_client_secret:
    file: ./secrets/google_client_secret
  jwt_secret:
    file: ./secrets/jwt_secret
  pgrst_tunnel_key:
    # An SSH key (like keys/pawn_oci.key), not an API key -- lives in keys/,
    # not secrets/, per the same convention as the existing deploy key.
    file: ./keys/pgrst_tunnel_key
  # PAWN 2.0 Phase E.4: separate key from pgrst_tunnel_key, deliberately --
  # least-privilege (that key's VM-side authorized_keys entry is restricted
  # to forwarding only 127.0.0.1:3002; this one needs 127.0.0.1:5432
  # instead, a DIFFERENT port, so it should be a DIFFERENT restricted key,
  # not a widened version of the existing one). One-time VM setup required
  # (generate a keypair, restrict it in the VM's authorized_keys to
  # `command="echo tunnel-only",no-pty,no-agent-forwarding,no-X11-forwarding,
  # permitopen="127.0.0.1:5432"`) before this file needs to exist -- not
  # created by this pass, since it requires the user's own VM access.
  keys_tunnel_key:
    file: ./keys/keys_tunnel_key

  # Phase 1b (2026-07-21, wired 2026-07-23): operator-supplied shared
  # free-tier pool keys. Stack starts fine with none of these files present
  # — confirmed live via a scratch probe that `docker compose up` only warns
  # ("secret file does not exist") and still exits 0 when a source file is
  # missing. `app/config.py`'s `read_pool_key()` and every endpoint's
  # `key_source` already fall through to BYOK exactly as before when a
  # provider's file is absent. To actually enable a provider's pool: copy
  # `secrets/pool_<provider>_api_key.example` to
  # `secrets/pool_<provider>_api_key` with a real key, then restart — no
  # further compose edits needed, the entries already exist here and on the
  # backend service.
  pool_cerebras_api_key:
    file: ./secrets/pool_cerebras_api_key
  pool_github_api_key:
    file: ./secrets/pool_github_api_key
  pool_google_api_key:
    file: ./secrets/pool_google_api_key
  pool_groq_api_key:
    file: ./secrets/pool_groq_api_key
  pool_huggingface_api_key:
    file: ./secrets/pool_huggingface_api_key
  pool_kluster_api_key:
    file: ./secrets/pool_kluster_api_key
  pool_mistral_api_key:
    file: ./secrets/pool_mistral_api_key
  pool_nvidia_api_key:
    file: ./secrets/pool_nvidia_api_key
  pool_openrouter_api_key:
    file: ./secrets/pool_openrouter_api_key
  pool_sambanova_api_key:
    file: ./secrets/pool_sambanova_api_key
  pool_zhipu_api_key:
    file: ./secrets/pool_zhipu_api_key
