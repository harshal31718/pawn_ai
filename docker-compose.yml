services:
  backend:
    build: ./backend
    ports:
      - "8001:8000"
    secrets:
      - postgres_dsn
      - encryption_secret
      - google_client_id
      - google_client_secret
      - jwt_secret
    environment:
      # Public URL for the self-hosted PostgREST instance (D.4) — non-secret,
      # injected into warm Kaggle-session payloads. Blank by default: the
      # D.3/D.4 migration off Supabase (whose REST URL was always public,
      # so local warm-session testing worked before that migration with no
      # extra setup) moved PostgREST to a local-only Docker container with no
      # public URL. To test warm sessions locally, use the `cloudflared`
      # tunnel service below (see its comment) instead of editing this line —
      # a docker-compose.override.yml supplies the real value.
      - POSTGREST_PUBLIC_URL=
    volumes:
      - ./backend/data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /app/app
        - action: rebuild
          path: ./backend/requirements.txt

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: pawn
      POSTGRES_USER: pawn
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - postgrest_anon_password
    volumes:
      - pawn_postgres_data:/var/lib/postgresql/data
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./postgres/init_pawn_anon.sh:/docker-entrypoint-initdb.d/02_pawn_anon.sh:ro
    ports:
      # 5433, not 5432 — 5432 collides with other local Postgres containers
      # (e.g. a sibling project's timescaledb) on a dev machine. Loopback-only;
      # only for host-side psql/GUI debugging, the backend reaches this over
      # the internal Docker network at postgres:5432 regardless.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawn -d pawn"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:v12.2.3
    environment:
      PGRST_DB_URI: "@/run/secrets/postgrest_db_uri"
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: pawn_anon
    secrets:
      - postgrest_db_uri
    depends_on:
      postgres:
        condition: service_healthy
    # No host port: internal-only, reached over HTTPS via the Nginx reverse
    # proxy set up in D.7 (production). Not usable from a local dev compose up
    # alone — see the POSTGREST_PUBLIC_URL note on the backend service above.

  # Dev-only tunnel so a remote Kaggle warm-session kernel can reach the local
  # `postgrest` container (regression from the D.3/D.4 Supabase -> self-hosted
  # Postgres+PostgREST migration: Supabase's URL was always public, so local
  # warm-session testing worked before that migration without this). Not part
  # of the default `docker compose up` -- gated behind the `tunnel` profile so
  # nothing changes for anyone not testing Image Lab locally. Usage:
  #   docker compose --profile tunnel up -d cloudflared
  #   docker compose logs cloudflared   # grab the printed https://*.trycloudflare.com URL
  #   copy docker-compose.override.yml.example to docker-compose.override.yml,
  #   paste the URL into POSTGREST_PUBLIC_URL, then `docker compose up -d backend`
  # to restart the backend so it picks up the new env var.
  cloudflared:
    image: cloudflare/cloudflared:latest
    # --protocol http2: QUIC (the default transport) dials over UDP, which
    # this host's Docker Desktop network setup repeatedly fails to establish
    # ("failed to dial to edge with quic: timeout: no recent network
    # activity", retried with exponential backoff, never connects). HTTP/2
    # runs over plain TCP 443, which isn't blocked the same way.
    command: tunnel --no-autoupdate --protocol http2 --url http://postgrest:3000
    depends_on:
      - postgrest
    profiles:
      - tunnel

  frontend:
    build: ./frontend
    ports:
      - "5174:5173"
    environment:
      - VITE_API_URL=http://localhost:8001
    volumes:
      - /app/node_modules
    command: npm run dev -- --host
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: rebuild
          path: ./frontend/package.json

volumes:
  pawn_postgres_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  postgres_dsn:
    file: ./secrets/postgres_dsn
  postgrest_anon_password:
    file: ./secrets/postgrest_anon_password
  postgrest_db_uri:
    file: ./secrets/postgrest_db_uri
  encryption_secret:
    file: ./secrets/encryption_secret
  google_client_id:
    file: ./secrets/google_client_id
  google_client_secret:
    file: ./secrets/google_client_secret
  jwt_secret:
    file: ./secrets/jwt_secret
