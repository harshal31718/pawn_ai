services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    secrets:
      - gemini_api_key
      - cerebras_api_key
      - groq_api_key
      - huggingface_api_key
      - github_api_key
      - openrouter_api_key
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

secrets:
  gemini_api_key:
    file: ./secrets/gemini_api_key
  cerebras_api_key:
    file: ./secrets/cerebras_api_key
  groq_api_key:
    file: ./secrets/groq_api_key
  huggingface_api_key:
    file: ./secrets/huggingface_api_key
  github_api_key:
    file: ./secrets/github_api_key
  openrouter_api_key:
    file: ./secrets/openrouter_api_key
