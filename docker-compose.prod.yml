# PAWN — production compose, deployed to its own dedicated VM (see deployment.md)
#
# ONE file drives BOTH environments; an env file selects which:
#   Staging:  docker compose --env-file .env.staging -f docker-compose.prod.yml up -d --build
#   Prod:     docker compose --env-file .env.prod    -f docker-compose.prod.yml up -d --build
#
# The env file sets COMPOSE_PROJECT_NAME (pawn / pawn-dev), the loopback host
# ports, and the non-secret deployment URLs. Docker prefixes every volume and
# network with the project name, so staging (`pawn-dev`) and prod (`pawn`) are
# fully isolated on the same host — the `postgres_data` volume below becomes
# `pawn_postgres_data` vs `pawn-dev_postgres_data` automatically.
#
# HARD RULES (see deployment.md): never bind 80/443 directly (the host's
# system Nginx owns them and terminates TLS), never publish a port without a
# 127.0.0.1: prefix. The frontend is NOT a service here — Nginx serves the
# static build from frontend/dist (built during deploy).

services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      # Loopback only — Nginx reverse-proxies https://<domain>/ -> here.
      - "127.0.0.1:${BACKEND_PORT}:8000"
    secrets:
      - postgres_dsn
      - encryption_secret
      - google_client_id
      - google_client_secret
      - jwt_secret
    environment:
      # All non-secret, env-file driven, per-environment (see .env.*.example).
      - CORS_ORIGINS=${CORS_ORIGINS}
      - FRONTEND_URL=${FRONTEND_URL}
      - OAUTH_REDIRECT_URI=${OAUTH_REDIRECT_URI}
      - CSP_CONNECT_SRC=${CSP_CONNECT_SRC}
      - POSTGREST_PUBLIC_URL=${POSTGREST_PUBLIC_URL}
    volumes:
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    # Uses the image's default CMD (uvicorn, NO --reload). Resource-capped so a
    # runaway PAWN process can never starve Enma's trading engine (hard rule 9).
    # Per-container `cpus` must fit the host's actual vCPU count: the permanent
    # target is a free-tier Ampere A1 (1 OCPU = 1 vCPU, no SMT), not the x86
    # E5.Flex bridge box (1 OCPU = 2 vCPUs via hyperthreading) these were
    # originally sized for — Docker rejects any single container's `cpus` above
    # the host's vCPU count. Sized to sum to ~1.0 across all three services.
    mem_limit: 1g
    cpus: 0.6

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pawn
      POSTGRES_USER: pawn
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - postgrest_anon_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./postgres/init_pawn_anon.sh:/docker-entrypoint-initdb.d/02_pawn_anon.sh:ro
    # No host port in prod — the backend reaches Postgres over the internal
    # compose network at postgres:5432. (For one-off debugging you can add
    # `ports: ["127.0.0.1:5433:5432"]` temporarily, then remove it.)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawn -d pawn"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 0.3

  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    ports:
      # Loopback only — Nginx reverse-proxies https://<domain>/pgrst/ -> here so
      # the warm Kaggle kernel can rendezvous. Anonymous callers get the
      # restricted `pawn_anon` role (SELECT/INSERT/UPDATE on image_sessions /
      # image_jobs only). Scoped per-session JWT is still deferred — MANDATORY
      # before real multi-user (see postgres/schema.sql + Phase W notes).
      - "127.0.0.1:${POSTGREST_PORT}:3000"
    environment:
      PGRST_DB_URI: "@/run/secrets/postgrest_db_uri"
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: pawn_anon
    secrets:
      - postgrest_db_uri
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.1

volumes:
  postgres_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  postgres_dsn:
    file: ./secrets/postgres_dsn
  postgrest_anon_password:
    file: ./secrets/postgrest_anon_password
  postgrest_db_uri:
    file: ./secrets/postgrest_db_uri
  encryption_secret:
    file: ./secrets/encryption_secret
  google_client_id:
    file: ./secrets/google_client_id
  google_client_secret:
    file: ./secrets/google_client_secret
  jwt_secret:
    file: ./secrets/jwt_secret
