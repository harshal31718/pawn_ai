# PAWN — production compose, deployed to its own dedicated VM (see deployment.md)
#
# ONE file drives BOTH environments; an env file selects which:
#   Staging:  docker compose --env-file .env.staging -f docker-compose.prod.yml up -d --build
#   Prod:     docker compose --env-file .env.prod    -f docker-compose.prod.yml up -d --build
#
# The env file sets COMPOSE_PROJECT_NAME (pawn / pawn-dev), the loopback host
# ports, and the non-secret deployment URLs. Docker prefixes every network
# with the project name, so staging (`pawn-dev`) and prod (`pawn`) stay
# isolated on the same host.
#
# Postgres runs as a local, memory-capped container on the same VM (Supabase
# was dropped: the hosted project vanished and broke login). Data lives in the
# `postgres_data` volume — never `docker compose down -v` (see deployment.md).
#
# HARD RULES (see deployment.md): never bind 80/443 directly (the host's
# system Nginx owns them and terminates TLS), never publish a port without a
# 127.0.0.1: prefix. The frontend is NOT a service here — Nginx serves the
# static build from frontend/dist (built during deploy).

services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      # Loopback only — Nginx reverse-proxies https://<domain>/ -> here.
      - "127.0.0.1:${BACKEND_PORT}:8000"
    secrets:
      - postgres_dsn
      - encryption_secret
      - google_client_id
      - google_client_secret
      - jwt_secret
    environment:
      # All non-secret, env-file driven, per-environment (see .env.*.example).
      # PAWN 2.0 Phase E.1: staging sets PAWN_ENV=dev, prod sets PAWN_ENV=prod —
      # isolates Drive folders + Kaggle slugs even though staging/prod already
      # get separate Postgres/secrets (comment at the top of .env.staging.example).
      - PAWN_ENV=${PAWN_ENV}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - FRONTEND_URL=${FRONTEND_URL}
      - OAUTH_REDIRECT_URI=${OAUTH_REDIRECT_URI}
      - CSP_CONNECT_SRC=${CSP_CONNECT_SRC}
      - POSTGREST_PUBLIC_URL=${POSTGREST_PUBLIC_URL}
    volumes:
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    # Resource-capped for the GCP e2-micro host (1 shared vCPU / 1GB RAM,
    # free tier). Caps sum to ~828MB (backend 500 + postgres 200 + postgrest
    # 128); the host swapfile is the burst buffer (see deployment.md).
    mem_limit: 500m
    cpus: 0.5

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pawn
      POSTGRES_USER: pawn
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - postgrest_anon_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./postgres/init_pawn_anon.sh:/docker-entrypoint-initdb.d/02_pawn_anon.sh:ro
    # Tuned small for a 1GB host. No host port: reached at postgres:5432 on
    # the internal compose network only.
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=30
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=128MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawn -d pawn"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 200m
    cpus: 0.3

  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    ports:
      # Loopback only — Nginx reverse-proxies https://<domain>/pgrst/ -> here so
      # the warm Kaggle kernel can rendezvous. Anonymous callers get the
      # restricted `pawn_anon` role (SELECT/INSERT/UPDATE on image_sessions /
      # image_jobs only). Scoped per-session JWT is still deferred — MANDATORY
      # before real multi-user (see postgres/schema.sql + Phase W notes).
      - "127.0.0.1:${POSTGREST_PORT}:3000"
    environment:
      PGRST_DB_URI: "@/run/secrets/postgrest_db_uri"
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: pawn_anon
    secrets:
      - postgrest_db_uri
    # This Compose version doesn't support secret uid/gid/mode (silently
    # ignored) — Compose (non-Swarm) bind-mounts the secret file directly,
    # so it keeps its host-side ownership/permissions inside the container.
    # postgrest's image runs as UID 1000; the host file at
    # ./secrets/postgrest_db_uri must be chown 1000:1000, mode 400 (not
    # world-readable) for postgrest to read it. See deployment.md.
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.1

volumes:
  postgres_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  postgrest_anon_password:
    file: ./secrets/postgrest_anon_password
  postgres_dsn:
    file: ./secrets/postgres_dsn
  postgrest_db_uri:
    file: ./secrets/postgrest_db_uri
  encryption_secret:
    file: ./secrets/encryption_secret
  google_client_id:
    file: ./secrets/google_client_id
  google_client_secret:
    file: ./secrets/google_client_secret
  jwt_secret:
    file: ./secrets/jwt_secret
